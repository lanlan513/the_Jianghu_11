<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>墨剑谱 · 十二名剑剑意图</title>
<style>
  :root { --paper:#f7f3e8; --ink:#26282e; --cinnabar:#b23428; --muted:#6a6552; }
  * { box-sizing: border-box; }
  body { margin:0; background:#e6dfcd; color:var(--ink);
         font-family:"Songti SC","STSong","Noto Serif CJK SC","SimSun",serif; }
  header { text-align:center; padding:26px 16px 6px; }
  h1 { font-size:32px; letter-spacing:16px; margin:0 0 8px; font-weight:600; text-indent:16px; }
  header p { margin:0 auto; max-width:780px; color:var(--muted); font-size:13px; line-height:1.8; }
  main { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
         gap:16px; padding:18px; max-width:1280px; margin:0 auto; }
  .card { margin:0; background:var(--paper); border:1px solid #d8d0ba; border-radius:4px;
          padding:10px; box-shadow:0 2px 10px rgba(60,50,30,.12); }
  .card canvas { width:100%; aspect-ratio:3/4; display:block; cursor:pointer;
                 background:#f3eee1; border:1px solid #e2dac4; }
  figcaption { padding-top:8px; font-size:12px; color:var(--muted); }
  .row.name { display:flex; justify-content:space-between; align-items:baseline; }
  .cn { font-size:18px; color:var(--ink); letter-spacing:4px; }
  .seed { color:var(--cinnabar); font-size:11px; }
  .bars { display:grid; grid-template-columns:1fr 1fr; gap:2px 10px; margin:6px 0; }
  .bar { display:flex; align-items:center; gap:5px; }
  .bar i { font-style:normal; font-size:10px; color:#8a8272; width:10px; }
  .bar b { flex:1; height:4px; background:#e0d8c2; border-radius:2px; overflow:hidden; }
  .bar em { display:block; height:100%; background:#3a3d45; }
  .fp, .ms { font-size:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  footer { text-align:center; color:#8a8272; font-size:12px; padding:8px 16px 28px; line-height:1.8; }
  code { background:#ded5bd; padding:0 4px; border-radius:3px; }
</style>
</head>
<body>
<header>
  <h1>墨 剑 谱</h1>
  <p>十二名剑 · 剑意写意图 —— 锋为笔、硬为墨、韧为势、工为缀。<br>
     同一剑同一意，画必相同；点击任意一幅换「笔意」（每剑六意），种子同步写入地址栏。</p>
</header>
<main id="grid"></main>
<footer>
  纯 Canvas 手写贝塞尔 + 自研格点噪声 · 零依赖 · 禁用 Math.random · 按 devicePixelRatio 矢量重绘不模糊<br>
  指纹断言：<code>window.SwordInk.fingerprint(剑号, 笔意)</code> → <code>{pts, ink, bbox}</code>，
  或读取每幅卡片的 <code>data-fingerprint</code> 属性
</footer>
<script src="sword-ink.js"></script>
<script>
(function () {
  'use strict';
  var SWORDS = SwordInk.SWORDS;
  var NV = SwordInk.VARIANTS;
  var grid = document.getElementById('grid');
  var cards = [];

  /* ---- 地址栏种子：#v=意0,意1,...,意11 ---- */
  function parseHash() {
    var m = /(?:^|#|&)v=([0-9,]+)/.exec(location.hash || '');
    var arr = m ? m[1].split(',').map(function (s) { return parseInt(s, 10) || 0; }) : [];
    while (arr.length < SWORDS.length) arr.push(0);
    return arr.slice(0, SWORDS.length).map(function (v) { return ((v % NV) + NV) % NV; });
  }
  var variants = parseHash();
  function writeHash() {
    history.replaceState(null, '', '#v=' + variants.join(','));
  }

  /* ---- 建卡片 ---- */
  var ATTR_KEYS = ['sharp', 'hard', 'flex', 'craft'];
  var ATTR_NAMES = '锋硬韧工';
  SWORDS.forEach(function (s, i) {
    var fig = document.createElement('figure');
    fig.className = 'card';
    var bars = ATTR_KEYS.map(function (k, j) {
      return '<div class="bar"><i>' + ATTR_NAMES[j] + '</i><b><em style="width:' +
             Math.round(s[k] * 100) + '%"></em></b></div>';
    }).join('');
    fig.innerHTML =
      '<canvas role="img" aria-label="' + s.name + '剑意图"></canvas>' +
      '<figcaption>' +
        '<div class="row name"><span class="cn">' + s.name + '</span><span class="seed"></span></div>' +
        '<div class="bars">' + bars + '</div>' +
        '<div class="fp"></div><div class="ms"></div>' +
      '</figcaption>';
    fig.querySelector('canvas').addEventListener('click', function () {
      variants[i] = (variants[i] + 1) % NV; // 换笔意：只换构图参数，仍可复现
      writeHash();
      renderOne(i);
    });
    grid.appendChild(fig);
    cards.push(fig);
  });

  /* ---- DPR 适配：按设备像素比分配位图，全部矢量重绘，绝不拉伸模糊 ---- */
  function fitCanvas(canvas) {
    var dpr = Math.min(window.devicePixelRatio || 1, 3);
    var rect = canvas.getBoundingClientRect();
    var w = Math.max(1, Math.round(rect.width * dpr));
    var h = Math.max(1, Math.round(rect.height * dpr));
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    var ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { ctx: ctx, W: rect.width, H: rect.height };
  }

  var fps = new Array(SWORDS.length);
  function renderOne(i) {
    var canvas = cards[i].querySelector('canvas');
    var fit = fitCanvas(canvas);
    var t0 = performance.now();
    var fp = SwordInk.render(fit.ctx, fit.W, fit.H, i, variants[i]);
    var dt = performance.now() - t0;
    fps[i] = fp;
    var fig = cards[i];
    fig.dataset.fingerprint = JSON.stringify(fp);
    fig.querySelector('.seed').textContent = '种子 ' + i + '·意' + variants[i];
    fig.querySelector('.fp').textContent =
      '指纹 点' + fp.pts + ' 墨' + fp.ink + ' 框[' + fp.bbox.join(',') + ']';
    fig.querySelector('.ms').textContent =
      '渲染 ' + dt.toFixed(1) + 'ms · ' + SWORDS[i].note;
    fig.title = SWORDS[i].name + ' · 点击换笔意';
  }
  function renderAll() { for (var i = 0; i < SWORDS.length; i++) renderOne(i); }

  var rt;
  window.addEventListener('resize', function () {
    clearTimeout(rt); rt = setTimeout(renderAll, 150);
  });
  window.addEventListener('hashchange', function () {
    variants = parseHash(); renderAll();
  });

  renderAll();
  writeHash(); // 种子写进地址栏

  // 供自动化断言
  window.SwordInkUI = {
    renderAll: renderAll,
    renderOne: renderOne,
    fingerprints: function () { return fps.slice(); },
    variants: function () { return variants.slice(); }
  };
})();
</script>
</body>
</html>
